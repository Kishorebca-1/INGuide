<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155c5d" />
    <title>Roamly — Reset password</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="experience" aria-label="Reset password">
        <a class="brand" href="Login.html" aria-label="Back to sign in"><span class="brand-mark">R</span><span>roamly</span></a>
        <section class="login-panel" aria-labelledby="reset-title">
          <div class="panel-copy">
            <h1 id="reset-title">Set a new password</h1>
            <p>Choose a new password with at least 8 characters.</p>
          </div>
          <form id="reset-password-form" novalidate>
            <div class="field-group">
              <label for="reset-password">New password</label>
              <input id="reset-password" type="password" autocomplete="new-password" minlength="8" required />
            </div>
            <div class="field-group">
              <label for="reset-password-confirm">Confirm new password</label>
              <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required />
            </div>
            <button class="login-button" type="submit">Reset password <span>→</span></button>
            <p class="status-message" id="reset-status-message" aria-live="polite"></p>
          </form>
          <p class="signup"><a href="Login.html">Back to sign in</a></p>
        </section>
      </section>
    </main>
    <script src="../JS/auth-config.js"></script>
    <script src="../JS/script.js"></script>
  </body>
</html>
